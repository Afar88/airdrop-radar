name: Airdrop Radar daily scan
on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC = 08:15 WAT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Binance announcements
        run: python3 radar.py --days 7 --only free,cheap,other --md LATEST.md
      - name: Commit report
        run: |
          git config user.name "airdrop-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add LATEST.md
          git diff --cached --quiet || git commit -m "Radar update $(date -u +%F)"
          git push
